[metadata]
name = PhyloJunction
version = 0.0.2
description = A Python environment for protopying, simulating, and learning with evolutionary models
long_description = file: README.rst
author = Fabio K. Mendes
author_email = fmendes@lsu.edu
url = https://phylojunction.org
license = GPL-3.0 

# we need the src references because we use a src/ file structure
[options]
zip_safe = False
python_requires = >=3.10
install_requires =
    numpy>=1.22.0
    matplotlib>=3.5.1
    seaborn>=0.13.2
    PySimpleGUI>=4.57.0
    pandas>=1.4.2
    dendropy>=4.5.2
    scipy>=1.8.1
    pyperclip>=1.8.2
    tabulate>=0.8.10
    PySide6>=6.3.2
    superqt[pyside6]>=0.8.2
    natsort>=8.4.0
    arviz>=0.17.0
package_dir = 
    = src
packages = find:

[options.packages.find]
where = src

[options.entry_points]
console_scripts =
    pjcli = phylojunction.interface.pjcli.pj_cli:call_cli
gui_scripts = 
    pjgui = phylojunction.interface.pysidegui.pj_gui:call_gui